[package]
name = "embarch-desk"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "The EmbArch desk: work items that join a Linear issue to its PRs, Claude Code sessions, bench activity and time, plus the Linear/Harvest/GitHub/Slack connectors behind embarch-ui's Desk tab. embarch-doc/embarch-desk/spec.md is current truth."

[dependencies]
anyhow = "1.0.103"
axum = "0.8"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6.2", features = ["derive"] }
getrandom = "0.2"
# Same pin and feature set as embarch-core-client: one TLS stack across the suite.
reqwest = { version = "0.13.4", default-features = false, features = ["json", "query", "rustls"] }
rmcp = { version = "2.2.0", features = ["server", "transport-io"] }
schemars = "1.2.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.53.0", features = ["full"] }
toml = "1.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
